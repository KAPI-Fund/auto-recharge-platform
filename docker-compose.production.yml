services:
  postgres:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        - ping
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN is required}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required}
      SESSION_ENCRYPTION_KEY_FALLBACKS: ${SESSION_ENCRYPTION_KEY_FALLBACKS:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?ADMIN_TOKEN_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SECONDARY_PASSWORD: ${ADMIN_SECONDARY_PASSWORD:?ADMIN_SECONDARY_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      STORE_DEBUG_MODE: ${STORE_DEBUG_MODE:-1}
      RECHARGE_QUEUED_TIMEOUT_SECONDS: ${RECHARGE_QUEUED_TIMEOUT_SECONDS:-600}
      RECHARGE_TASK_LEASE_TIMEOUT_SECONDS: ${RECHARGE_TASK_LEASE_TIMEOUT_SECONDS:-60}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_NOTIFY_PURCHASE: ${EMAIL_NOTIFY_PURCHASE:-true}
      EMAIL_NOTIFY_REDEEM: ${EMAIL_NOTIFY_REDEEM:-true}
      EMAIL_SITE_NAME: ${EMAIL_SITE_NAME:-KC GPT自动充值系统}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-}
      EMAIL_SMTP_FROM_NAME: ${EMAIL_SMTP_FROM_NAME:-KC GPT自动充值系统}
      EMAIL_SMTP_USE_TLS: ${EMAIL_SMTP_USE_TLS:-true}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-10}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-1}
      DEFAULT_RECHARGE_MODE: ${DEFAULT_RECHARGE_MODE:-browser}
      BROWSER_POOL_CONTROL_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN is required}
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"

  worker:
    environment:
      API_BASE_URL: http://api:8080
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-1}
      LEGACY_HEADFUL: ${LEGACY_HEADFUL:-0}
      CHECKOUT_MODE: ${CHECKOUT_MODE:-api}
      BROWSER_POOL: ${BROWSER_POOL:-1}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-2}
      BROWSER_POOL_BASE_PORT: ${BROWSER_POOL_BASE_PORT:-19222}
      HCAPTCHA_SOLVER_ENABLED: ${HCAPTCHA_SOLVER_ENABLED:-1}
      HCAPTCHA_VLM_API_KEY: ${HCAPTCHA_VLM_API_KEY:-}
      HCAPTCHA_VLM_BASE_URL: ${HCAPTCHA_VLM_BASE_URL:-https://api.openai.com/v1}
      HCAPTCHA_VLM_MODEL: ${HCAPTCHA_VLM_MODEL:-gpt-5.5}
      HCAPTCHA_CAPTCHA_PLATFORM_API_KEY: ${HCAPTCHA_CAPTCHA_PLATFORM_API_KEY:-}
      HCAPTCHA_CAPTCHA_PLATFORM_API_URL: ${HCAPTCHA_CAPTCHA_PLATFORM_API_URL:-https://api.capsolver.com}
      HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT: ${HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT:-180}
    # Worker control API is for Compose-internal API -> Worker traffic only.
    ports: !override []

  web:
    ports: !override
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
